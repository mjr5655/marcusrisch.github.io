name: Vino
options:
  bundleIdPrefix: com.marcusrisch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vino:
    type: application
    platform: iOS
    sources:
      - Vino
    info:
      path: Vino/Info.plist
      properties:
        CFBundleDisplayName: Vino
        UILaunchScreen: {}
        NSCameraUsageDescription: Vino uses the camera to photograph wine labels and fill in the details for you.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcusrisch.vino
  VinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VinoTests
    dependencies:
      - target: Vino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcusrisch.vino.tests
schemes:
  Vino:
    build:
      targets:
        Vino: all
    test:
      targets:
        - VinoTests
